services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: granite
      POSTGRES_PASSWORD: granite
      POSTGRES_DB: granitemeasure
    ports:
      - "5432:5432"
    volumes:
      - granite_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U granite -d granitemeasure"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql+psycopg://granite:granite@postgres:5432/granitemeasure
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:3000
      DEMO_MODE: "false"
    volumes:
      - ./backend:/app
      - granite_storage:/app/storage
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://granite:granite@postgres:5432/granitemeasure
      REDIS_URL: redis://redis:6379/0
      DEMO_MODE: "false"
    volumes:
      - ./backend:/app
      - granite_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: python -m app.workers.rq_worker

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev

volumes:
  granite_pg:
  granite_storage:
